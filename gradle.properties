org.gradle.jvmargs=-Xmx1024m
android.useAndroidX=true
android.enableJetifier=false
# Plataforma del Android SDK usada para compilar (debe estar instalada).
pad.compileSdk=28
# Opcional: fija unas build-tools concretas (si se omite, AGP 4.2.2 usa la 30.0.2).
# pad.buildTools=28.0.3
# Evita un NullPointerException de D8 (AGP 4.2) al convertir libadb-android y spake2-android a dex
android.enableDexingArtifactTransform=false
android.useFullClasspathForDexingTransform=true
